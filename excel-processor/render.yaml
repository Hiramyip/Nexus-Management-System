services:
  - type: web
    name: nexus-excel-processor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PORT
        value: 8003
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
